name: MCP Integration Test

on:
  workflow_dispatch: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  mcp-test:
    runs-on: ubuntu-24.04

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
      LIVEREVIEW_API_KEY_TR: ${{ secrets.LIVEREVIEW_API_KEY_TR }}
      TEST_REPO_URL: ${{ secrets.TEST_REPO_URL }}
      LIVEREVIEW_IS_CLOUD: ${{ secrets.LIVEREVIEW_IS_CLOUD }}
      RAZORPAY_MODE: ${{ secrets.RAZORPAY_MODE }}
      LIVEREVIEW_PRICING_PROFILE: ${{ secrets.LIVEREVIEW_PRICING_PROFILE }}


    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          pip install -r tests/mcp/requirements.txt

      - name: Build LiveReview
        run: make build-ci

      - name: Install dbmate
        run: sudo npm install -g dbmate

      - name: Run staging migrations
        run: dbmate --url "$DATABASE_URL" up

      - name: Start MCP server
        run: |
          nohup ./livereview api > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server startup
        run: |
          for i in {1..30}; do
            response=$(curl -s http://localhost:8888/health || true)

            if echo "$response" | grep -q '"status":"healthy"\|"status": "healthy"'; then
              echo "Server is healthy"
              exit 0
            fi

            echo "Waiting for server to start..."
            sleep 2
          done

          echo "Server failed to become healthy"
          cat server.log
          exit 1

      - name: Run MCP test script
        run: |
          python tests/mcp/mcp-testcase.py

      - name: Check MCP test result
        run: |
          python - <<EOF
          import json
          import sys

          with open("tests/mcp/test_results.json") as f:
              result = json.load(f)

          status = result.get("suite_summary", {}).get("overall_status")

          print(f"Overall Status: {status}")

          if status == "PASSED":
              print("MCP test passed")
              sys.exit(0)

          print("MCP test failed")
          print(json.dumps(result, indent=2))
          sys.exit(1)
          EOF
      - name: Upload MCP Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcp-test-results
          path: tests/mcp/test_results.json
          retention-days: 30
      - name: Print server logs on failure
        if: failure()
        run: cat server.log || true

      - name: Cleanup
        if: always()
        run: |
          kill $(cat server.pid) || true

