name: livereview-tests

on:
  workflow_dispatch: {}

permissions:
  contents: read
  statuses: write

jobs:
  livereview-tests:
    runs-on: ubuntu-24.04
    # Throwaway database per run, so tests never touch staging or collide with other runs.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: livereview
          POSTGRES_PASSWORD: livereview_password_123
          POSTGRES_DB: livereview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U livereview"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://livereview:livereview_password_123@localhost:5432/livereview?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Install dbmate
        run: sudo npm install -g dbmate

      # Fails the job if the database isn't up, so DB tests can't silently skip.
      - name: Run migrations
        run: dbmate --url "$DATABASE_URL" --no-dump-schema up

      - name: Run Go tests
        run: make testall

      - name: Report status to commit SHA
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$STATE" \
            -f context="livereview-tests" \
            -f description="LiveReview tests completed with status: $STATE" \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
